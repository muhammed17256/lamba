<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Firebase Kontrol Paneli</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f0f2f5; margin-top: 50px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; width: 300px; }
        h2 { color: #333; margin-bottom: 20px; }
        input { padding: 12px; margin: 8px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 12px; width: 100%; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .status { margin-top: 15px; font-weight: bold; font-size: 14px; }
        .success { color: green; }
        .error { color: red; }
        
        /* Kontrol Paneli Gizli Başlar */
        #controlPanel { display: none; margin-top: 20px; border-top: 1px solid #ddd; padding-top: 20px; }
        .gpio-btn { background-color: #ffc107; color: #000; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Giriş Yap</h2>
        
        <div id="loginForm">
            <input type="email" id="email" placeholder="Email Adresi">
            <input type="password" id="password" placeholder="Şifre">
            <button id="loginBtn">Giriş Yap</button>
            <p id="msg" class="status"></p>
        </div>

        <div id="controlPanel">
            <h3>ESP32 Kontrol</h3>
            <p>Giriş Başarılı!</p>
            <button id="ledBtn" class="gpio-btn">LED Durumunu Değiştir</button>
            <p>Durum: <span id="ledStatus">Bilinmiyor</span></p>
            <button id="logoutBtn" style="background-color: #dc3545;">Çıkış Yap</button>
        </div>
    </div>

    <script type="module">
        // 1. WEB İÇİN GEREKLİ KÜTÜPHANELER (CDN)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // 2. SENİN VERDİĞİN AYARLAR (Buraya yerleştirildi)
        const firebaseConfig = {
  apiKey: "AIzaSyB2M_I0jXDL0oZc-L8XMf5SCCsZjUjX1ao",
  authDomain: "esp-project-81867.firebaseapp.com",
  databaseURL: "https://esp-project-81867-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "esp-project-81867",
  storageBucket: "esp-project-81867.firebasestorage.app",
  messagingSenderId: "94322118306",
  appId: "1:94322118306:web:2acf1a572d678a822251fb",
  measurementId: "G-F2D4V7WJQV"
};

        // 3. UYGULAMAYI BAŞLAT
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Arayüz Elemanları
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const msgBox = document.getElementById('msg');
        const loginForm = document.getElementById('loginForm');
        const controlPanel = document.getElementById('controlPanel');
        const ledBtn = document.getElementById('ledBtn');
        const ledStatusDisplay = document.getElementById('ledStatus');

        // --- GİRİŞ YAPMA İŞLEMİ ---
        loginBtn.addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            msgBox.innerText = "Bağlanıyor...";
            msgBox.className = "status";

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    msgBox.innerText = "Giriş Başarılı!";
                    msgBox.className = "status success";
                })
                .catch((error) => {
                    console.error(error);
                    msgBox.innerText = "Hata: " + error.code;
                    msgBox.className = "status error";
                });
        });

        // --- ÇIKIŞ YAPMA İŞLEMİ ---
        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // --- KULLANICI DURUMUNU İZLEME (Giriş yaptı mı?) ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Kullanıcı giriş yapmışsa paneli göster, girişi gizle
                loginForm.style.display = 'none';
                controlPanel.style.display = 'block';
                
                // Veritabanını dinlemeye başla (Örnek: test/int)
                dinleVeritabani();
            } else {
                // Çıkış yapmışsa girişi göster
                loginForm.style.display = 'block';
                controlPanel.style.display = 'none';
                msgBox.innerText = "";
            }
        });

        // --- VERİTABANI İŞLEMLERİ ---
        function dinleVeritabani() {
            // ÖRNEK: Veritabanındaki 'test/int' yolunu dinliyoruz
            // Eğer senin ESP32 kodunda farklı bir yol varsa burayı değiştir.
            const dataRef = ref(db, 'test/int');

            onValue(dataRef, (snapshot) => {
                const data = snapshot.val();
                ledStatusDisplay.innerText = data; // Ekrana yaz
            });
        }

        // Butona basınca veritabanına veri gönder (Örnek: Rastgele sayı)
        ledBtn.addEventListener('click', () => {
            const rastgeleSayi = Math.floor(Math.random() * 100);
            set(ref(db, 'test/int'), rastgeleSayi);
        });

    </script>
</body>
</html>
